<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>みん経 札幌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 字体は描画を止めない読み方（media=print→onload で all）＝本文は即表示・字体が来たら地図を描き直す -->
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --ground:#070C12; --panel:#101823; --panel2:#172131; --line:#243248;
  --txt:#E6EBF2; --txt2:#98A5B8; --txt3:#6D7A8E;
  --p1:#F0A63A; --p2:#3FB0BF; --p3:#D2555F; --mkt:#5A6474;
  --up:#46C98E; --down:#F0626A; --snow:#F4F7FB; --alarm:#E1252F;
  --gold:#DCC085;   /* ログイン後の「あなたの物」の縁取り（--p1 はプレイヤー色なので別に持つ） */
  --paper:#F3EEE2; --ink:#1B1712; --ink2:#5A5146; --rule:#1B1712;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--txt);font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;line-height:1.6;font-size:15px;overflow-x:hidden}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:10px 56px}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.up{color:var(--up)} .dn{color:var(--down)}
a{color:var(--snow)}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--p1);outline-offset:2px}
h2{font-size:14px;letter-spacing:.08em;color:var(--txt2);font-weight:700;margin:0 0 10px}
.sec{margin-top:28px}

/* ---- 速報テロップ ---- */
.ticker{display:flex;align-items:stretch;background:#150A0C;border-bottom:1px solid #3A1418;overflow:hidden;height:38px}
.ticker .tag{flex:none;display:flex;align-items:center;gap:6px;background:var(--alarm);color:#fff;font-weight:700;font-size:14px;letter-spacing:.12em;padding:0 14px 0 12px;position:relative;z-index:1}
.ticker .tag::before{content:"";width:8px;height:8px;border-radius:50%;background:#fff;animation:blink 1s steps(2,start) infinite}
.ticker .rail{flex:1;overflow:hidden;position:relative;mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent)}
.ticker .belt{display:flex;width:max-content;animation:tick var(--dur,40s) linear infinite}
.ticker .belt span{display:flex;align-items:center;white-space:nowrap;font-size:14.5px;font-weight:700;padding:0 26px;line-height:38px;color:#FFE9E9}
.ticker .belt span b{color:#FFD166;margin-right:8px;font-weight:700}
.ticker .belt span::after{content:"◆";color:var(--alarm);font-size:10px;margin-left:26px}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes blink{to{visibility:hidden}}

/* ---- 上の帯 ---- */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding-block:10px 12px}
.logo{font-family:"Dela Gothic One",sans-serif;font-size:clamp(20px,3.4vw,28px);line-height:1.1;letter-spacing:.01em}
.logo small{display:block;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.16em;color:var(--txt3);margin-top:4px}
.stats{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:baseline;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:12.5px;color:var(--txt2)}
.chip b{color:var(--txt);font-size:14px;font-weight:600}
.chip.hot{border-color:var(--p1)} .chip.hot b{color:var(--p1)}

/* ---- ログイン・あなたの色 ---- */
.login{margin-top:4px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:end}
.login .lt{flex:1 1 240px}
.login .lt b{font-size:15px;display:block} .login .lt span{font-size:12.5px;color:var(--txt2)}
.login label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--txt2)}
.login select,.login input{font:inherit;font-size:15px;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:0;width:170px;max-width:100%}
.login button,.out{font:inherit;font-weight:700;font-size:14.5px;background:var(--p1);color:#1C1204;border:0;border-radius:10px;padding:10px 16px;cursor:pointer}
.out{background:transparent;color:var(--txt2);border:1px solid var(--line);font-weight:500;font-size:13px;padding:6px 12px}
.err{flex-basis:100%;font-size:12.5px;color:var(--down);margin:0}
.me{margin-top:4px;background:linear-gradient(90deg,color-mix(in srgb,var(--pc) 22%,var(--panel)),var(--panel) 70%);border:1px solid color-mix(in srgb,var(--pc) 60%,var(--line));border-radius:16px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;justify-content:space-between}
.me .who{font-size:13px;color:var(--txt2)} .me .who b{color:var(--pc);font-size:16px}
.me .big{font-family:"Dela Gothic One",sans-serif;font-size:clamp(19px,3.2vw,28px);line-height:1.25}
.me .big em{font-style:normal;color:var(--pc)}
.me .pc{font-family:"Dela Gothic One",sans-serif;font-size:clamp(30px,5vw,46px);color:var(--pc);line-height:1}
.me .pc small{font-family:"Zen Kaku Gothic New",sans-serif;font-size:13px;color:var(--txt2);display:block;font-weight:500;margin-top:4px}

/* ---- 地図 ---- */
.mapwrap{margin-top:12px}
.maps{display:grid;grid-template-columns:minmax(0,1.62fr) minmax(0,1fr);gap:12px;align-items:start}
/* 地図は1枚（2026-09-25 ボス「全体と詳細の2つが出て分かりにくい・1枚で大小は切り替え」） */
.maps{grid-template-columns:1fr}
.panel .box{transition:opacity .3s ease}
.panel .box.off{position:absolute;top:0;left:0;right:0;opacity:0;pointer-events:none}
.panel #wholebox{margin-inline:auto}
#zoomp{background:#050A10}   /* ぜんたい地図の左右の帯＝地図の外側の色（glowbgの端）と揃える */
@keyframes corehint{50%{stroke-opacity:.35}} .corehint{animation:corehint 1.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.panel .box{transition:none}}
.panel{position:relative;border-radius:18px;overflow:hidden;background:#050A10;border:1px solid var(--line);min-width:0}
.panel .box{position:relative;width:100%}
.panel svg{display:block;width:100%;height:100%}
.panel .ov{position:absolute;inset:0;pointer-events:none}
.panel .ov .hit{pointer-events:auto;cursor:pointer}
.maptitle{position:absolute;left:14px;top:12px;font-family:"Dela Gothic One",sans-serif;font-size:clamp(16px,2.3vw,24px);line-height:1.15;text-shadow:0 2px 12px #000,0 0 3px #000;pointer-events:none}
.maptitle small{display:block;font-family:"Zen Kaku Gothic New",sans-serif;font-weight:700;font-size:12px;color:var(--txt2);margin-top:4px}
.whole .maptitle{font-size:15px}
@media (max-width:560px){#maptitle{right:14px}#maptitle small{margin-top:30px}}
.zbtn{position:absolute;right:10px;top:10px;font:inherit;font-size:13px;font-weight:700;background:rgba(5,10,16,.85);color:var(--txt);border:1px solid #4A5E7A;border-radius:999px;padding:6px 13px;cursor:pointer}
.zbtn:hover{border-color:var(--snow)}
.legend{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:12px;color:var(--txt2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}
.osm{position:absolute;right:8px;bottom:6px;font-size:10.5px;color:#8A96A8;background:rgba(5,10,16,.75);padding:1px 6px;border-radius:4px}
.osm a{color:#AEB9C8}
.hint{font-size:12px;color:var(--txt3);margin:6px 2px 0}
.panel.mine .basemap{opacity:.5}
.panel.mine .it{opacity:.16;filter:grayscale(.9)}
.panel.mine .it.own{opacity:1;filter:drop-shadow(0 0 6px var(--pc))}
.panel.mine .pulse{stroke-opacity:.3}
/* あなたの物＝3重の印（①金の縁取り ②呼吸する光 ③旗＋「あなた」） */
.panel.mine .it.boss{opacity:1;filter:drop-shadow(0 0 8px var(--gold))}
.gring{fill:none;stroke:var(--gold);stroke-width:3;stroke-linejoin:round;animation:breath 2.4s ease-in-out infinite alternate}
.ghalo{fill:none;stroke:var(--gold);stroke-width:7;stroke-opacity:.35;filter:blur(3px);animation:breath 2.4s ease-in-out infinite alternate}
@keyframes breath{from{opacity:.55}to{opacity:1}}
.flag{pointer-events:none}
.maptitle small.ownline{display:block;margin-top:6px;font-family:"Zen Kaku Gothic New",sans-serif;font-weight:700;font-size:13px;color:var(--txt)}
.maptitle small.ownline b{color:var(--gold)}
.maptitle small.ownline.none{color:var(--txt2)}
.ownbar{margin:0 2px 8px}
.ownbar small.ownline{display:block;font-weight:700;font-size:13.5px;line-height:1.5;color:var(--txt)}
.ownbar small.ownline b{color:var(--gold)}
.ownbar small.ownline.none{color:var(--txt2)}
.ownbar .near{display:block;font-size:12.5px;color:var(--txt2)}
.maptitle small.ownline .near{display:block;margin-top:2px;font-size:12px;color:var(--txt2)}
@media (max-width:760px){.osm{font-size:9.5px}}
/* 地図の上の物の動き */
.rise{transform-box:fill-box;transform-origin:50% 100%;animation:rise .6s cubic-bezier(.2,.8,.2,1) backwards}   /* backwards＝終わったら変形を残さない（both だと描き直されずに消えて見えることがある） */
@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{transform:scale(.4);opacity:.95}100%{transform:scale(2.4);opacity:0}}
.siren{animation:siren .7s steps(2,start) infinite}
@keyframes siren{to{opacity:.15}}
.lotglow{filter:drop-shadow(0 0 4px currentColor)}
@media (prefers-reduced-motion:reduce){
  .ticker .belt{animation:none;flex-wrap:wrap;width:auto}
  .ticker{height:auto}
  .rise,.pulse,.siren,.ticker .tag::before,.gring,.ghalo{animation:none}
  .pulse{opacity:.5}
}

/* ---- 札幌経済新聞 ---- */
.paper{background:var(--paper);color:var(--ink);border-radius:6px;padding:20px 24px 22px;box-shadow:0 18px 60px rgba(0,0,0,.55);font-family:"Zen Old Mincho","Yu Mincho","Hiragino Mincho ProN",serif;background-image:radial-gradient(rgba(120,100,70,.08) 1px,transparent 1px);background-size:5px 5px}
.paper .mast{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:6px 14px;border-bottom:3px double var(--rule);padding-bottom:8px}
.paper .mast h2{font-family:"Zen Old Mincho",serif;font-weight:900;font-size:clamp(26px,4.6vw,44px);letter-spacing:.12em;color:var(--ink);margin:0;line-height:1}
.paper .mast .meta{font-family:"Zen Kaku Gothic New",sans-serif;font-size:12.5px;color:var(--ink2);text-align:right;line-height:1.5}
.paper .mast .meta b{color:var(--ink)}
.paper .headline{font-weight:900;font-size:clamp(26px,5.2vw,52px);line-height:1.18;margin:14px 0 6px;letter-spacing:.01em}
.paper .subh{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:700;font-size:clamp(14px,2vw,18px);display:inline-block;background:var(--ink);color:var(--paper);padding:2px 10px;margin-bottom:10px}
.paper .cols{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:18px;border-top:1px solid var(--rule);padding-top:12px}
.paper .body{columns:2;column-gap:22px;column-rule:1px solid rgba(27,23,18,.35);font-size:15px;line-height:1.85;font-weight:700}
.paper .body p{margin:0 0 .7em;text-indent:1em;break-inside:avoid-column}
.paper .side{border-left:1px solid var(--rule);padding-left:16px;display:flex;flex-direction:column;gap:10px}
.paper .side h3{font-family:"Zen Kaku Gothic New",sans-serif;font-size:12px;letter-spacing:.14em;margin:0;color:var(--ink2)}
.paper .side p{margin:0;font-size:14px;line-height:1.6;font-weight:700;padding-bottom:9px;border-bottom:1px dotted rgba(27,23,18,.5)}
.paper .note{font-family:"Zen Kaku Gothic New",sans-serif;font-size:11.5px;color:var(--ink2);margin:10px 0 0}
@media (max-width:760px){
  .paper{padding:16px 16px 18px}
  .paper .mast .meta{text-align:left}
  .paper .cols{grid-template-columns:1fr}
  .paper .body{columns:1}
  .paper .side{border-left:0;border-top:1px solid var(--rule);padding:10px 0 0}
}

/* ---- 見せ合い ---- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.show{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px}
@media (max-width:820px){.show{grid-template-columns:1fr}}
.rank{display:flex;flex-direction:column;gap:14px}
.row .nm{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14.5px;flex-wrap:wrap}
.row .nm b{display:flex;align-items:center;gap:7px}
.row .nm i{width:11px;height:11px;border-radius:3px;display:inline-block}
.row .pos{font-family:"Dela Gothic One",sans-serif;font-size:18px;width:1.6em;color:var(--txt2)}
.bar{height:10px;border-radius:99px;background:var(--panel2);overflow:hidden;margin-top:5px}
.bar b{display:block;height:100%;border-radius:99px}
.row small{display:block;font-size:12px;color:var(--txt2);margin-top:4px}
.row small em{font-style:normal;font-weight:700}
.jail{font-size:11px;font-weight:700;background:var(--alarm);color:#fff;border-radius:4px;padding:0 6px}
.empty{color:var(--txt3);font-size:13px}
.co .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.co .t b{font-size:18px}
.co .t .num{font-size:18px}
.co .k{font-size:12px;color:var(--txt2)}
.hold{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--panel2);margin-top:8px}
.hold b{display:block;height:100%}
.hl{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:12px;color:var(--txt2);margin-top:5px}
.hl i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle}

/* ---- 6社 ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.cc{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;text-align:left;color:inherit;font:inherit;min-width:0}
.cc[aria-pressed="true"]{border-color:var(--snow)}
.cc .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.cc .t b{font-size:15.5px}
.cc .p{display:flex;justify-content:space-between;align-items:end;gap:8px;margin-top:4px}
.cc .p .num{font-size:20px;font-weight:600}
.cc .f{font-size:12px;color:var(--txt3);margin-top:6px}
.boss{font-size:11px;font-weight:700;border-radius:4px;padding:0 6px;color:#0B1118}

/* ---- 今日の動き ---- */
.moves{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
@media (max-width:420px){.moves{grid-template-columns:1fr}}
.mv h3{margin:0 0 6px;font-size:15px;display:flex;align-items:center;gap:8px}
.mv h3 i{width:10px;height:10px;border-radius:3px;display:inline-block}
.mv ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.mv li{font-size:13.5px}
.mv li span{display:block;font-size:12px;color:var(--txt2)}
.alert{background:#2A1418;border:1px solid var(--down);border-radius:12px;padding:10px 14px;font-size:13.5px;margin-bottom:8px}

/* ---- あなただけの数字 ---- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:0}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tile dt{font-size:12px;color:var(--txt2)} .tile dd{margin:2px 0 0;font-size:22px;font-weight:600}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th,.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{font-size:12px;color:var(--txt2);font-weight:500}
.scroll{overflow-x:auto}
.day{border-left:2px solid var(--line);padding:2px 0 2px 14px;display:flex;flex-direction:column;gap:6px}
.day+.day{margin-top:16px}
.day .d{font-size:12px;color:var(--txt3);letter-spacing:.06em}
.quote{background:var(--panel2);border-radius:10px;padding:8px 12px;font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.quote small{display:block;color:var(--txt3);font-size:11.5px;margin-bottom:2px}
.trend{display:grid;grid-template-columns:minmax(0,1fr);gap:4px}
.trend svg{width:100%;height:80px;display:block}

/* ---- 判例帳・締切 ---- */
.rules{display:flex;flex-direction:column;gap:2px}
details{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
details+details{margin-top:6px}
summary{cursor:pointer;font-size:13.5px;font-weight:700}
summary .num{color:var(--txt3);font-weight:500;margin-right:8px;font-size:12px}
details p{margin:6px 0 2px;font-size:13px;color:var(--txt2);max-width:70ch}
.cta{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--p1);border-radius:14px;padding:14px 16px}
.cta b{font-size:16px} .cta span{font-size:13px;color:var(--txt2);display:block}
.btn{display:inline-block;background:var(--p1);color:#1C1204;font-weight:700;border-radius:11px;padding:11px 18px;text-decoration:none;font-size:14.5px}
footer{margin-top:28px;font-size:12px;color:var(--txt3);max-width:80ch}
/* tabs（09-25 ボス「タブかなんかで別ページに飛べるように」） */
.tabs{position:sticky;top:0;z-index:20;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;background:rgba(11,17,24,.92);backdrop-filter:blur(8px);padding:10px 0;margin-top:10px;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;font:inherit;font-weight:900;font-size:15.5px;color:var(--snow);background:linear-gradient(180deg,#26344A,#1A2536);border:1.5px solid rgba(240,166,58,.55);border-radius:12px;padding:11px 18px;min-height:46px;cursor:pointer;display:flex;align-items:center;gap:6px;box-shadow:0 3px 0 #0A1019;transition:transform .08s,box-shadow .08s}
.tabs button:hover{border-color:var(--p1);background:linear-gradient(180deg,#2E3F58,#1F2C40)}
.tabs button:active{transform:translateY(2px);box-shadow:0 1px 0 #0A1019}
.tabhint{margin:14px 0 -4px;font-size:13px;font-weight:700;color:var(--p1);letter-spacing:.04em}
.tabs button[aria-selected="true"]{background:var(--p1);color:#1C1204;border-color:#FFD08A;box-shadow:0 3px 0 #8A5A14,0 0 14px rgba(240,166,58,.45)}
@media (max-width:560px){
  .tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;overflow:visible}
  .tabs button{justify-content:center;padding:10px 4px;font-size:14.5px;white-space:nowrap}
}
.tabs button .badge{font-size:11px;background:var(--alarm,#E0343F);color:#fff;border-radius:99px;padding:0 6px}
.pane[hidden]{display:none}
.pane{animation:paneIn .25s ease-out}
@keyframes paneIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.pane{animation:none}}
</style>

<div class="ticker" role="region" aria-label="速報">
  <div class="tag">速報</div>
  <div class="rail"><div class="belt" id="belt"></div></div>
</div>
<div class="wrap">
  <header class="top">
    <div class="logo">みんなの経済戦争<small>EVERYBODY'S ECONOMIC WAR ／ 札幌</small></div>
    <div class="stats" id="stats"></div>
  </header>
  <div id="mebox"></div>

  <p class="tabhint">👇 ボタンを押すと画面が切り替わる</p>
  <nav class="tabs" role="tablist" aria-label="ページの切り替え" id="tabs">
    <button role="tab" data-t="town">🗺️ 街</button>
    <button role="tab" data-t="paper">📰 新聞</button>
    <button role="tab" data-t="rank">🏆 順位</button>

function holders(c){
  const list=players.map(p=>({p,n:(T&&T.players[p])?T.players[p].hold[c]:0})).filter(x=>x.n>0);
  const used=list.reduce((a,x)=>a+x.n,0);
  return {list,mkt:100-used};
}
const bossOf=c=>{const h=holders(c).list.find(x=>x.n>=51);return h?h.p:null};
function colorShare(p){               // 街の◯%＝土地の区画＋営業中の店＋6社（社長）のうち、その人の色の数
  let mine=0,all=0;
  if(LAND)for(const d in LAND){all+=LAND[d].lots.length;mine+=LAND[d].lots.filter(o=>o===p).length}
  if(T)for(const q in T.players)for(const b of T.players[q].biz||[])if(b.open){all++;if(q===p)mine++}
  all+=COS.length; mine+=COS.filter(c=>bossOf(c)===p).length;
  return {lots:LAND?Object.values(LAND).reduce((a,L)=>a+L.lots.filter(o=>o===p).length,0):0,
    shops:T&&T.players[p]?(T.players[p].biz||[]).filter(b=>b.open).length:0,
    boss:COS.filter(c=>bossOf(c)===p).length, pct:all?Math.round(mine/all*100):0};
}

const DIST=["札幌駅前","大通","すすきの","円山","琴似","麻生","新札幌","真駒内"];
const ST=MAP.stations, KM=MAP.kmU||20;
const at=(k,dx=0,dy=0)=>ST[k]?[ST[k].x+dx*KM,ST[k].y+dy*KM]:null;   // dx,dy は km
const CO_AT={"北海鉄道":at("札幌駅前",-.35,-.05),"札北銀行":at("大通",-.25,0),"ニトロ家具":at("札幌駅前",.15,-.55),
  "セイカマート":at("麻生",.2,.9),"北海ビール":at("苗穂",.1,-.7),"白い恋文製菓":at("宮の沢",0,-.3)};
const DIST_AT=Object.fromEntries(DIST.map(d=>[d,ST[d]?[ST[d].x,ST[d].y]:null]));
// 見る範囲＝点の集まりを囲む箱（padは km・縦横比 ar に広げる）
function frame(pts,padL,padR,padT,padB,ar){
  let x0=Math.min(...pts.map(p=>p[0]))-padL*KM,x1=Math.max(...pts.map(p=>p[0]))+padR*KM,y0=Math.min(...pts.map(p=>p[1]))-padT*KM,y1=Math.max(...pts.map(p=>p[1]))+padB*KM;
  const w=x1-x0,h=y1-y0; if(w/h<ar){const nw=h*ar;x0-=(nw-w)/2;x1+=(nw-w)/2}else{const nh=w/ar;y0-=(nh-h)/2;y1+=(nh-h)/2}
  return {x:x0,y:y0,w:x1-x0,h:y1-y0};
}

function baseSVG(){
  const pl=(d,a)=>`<polyline points="${d}" ${a}/>`, pg=(d,a)=>`<polygon points="${d}" ${a}/>`;
  const S='vector-effect="non-scaling-stroke" fill="none" stroke-linejoin="round" stroke-linecap="round"';
  let h=`<defs><clipPath id="cityclip">${MAP.city.map(d=>pg(d,'')).join('')}</clipPath>
  <radialGradient id="glowbg" cx="50%" cy="35%" r="70%"><stop offset="0" stop-color="#0F1C2B"/><stop offset="1" stop-color="#050A10"/></radialGradient>
  <filter id="gl" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`;
  h+=`<g id="mapG" class="basemap"><rect x="-500" y="-500" width="${MAP.W+1000}" height="${MAP.H+1000}" fill="url(#glowbg)"/>`;
  h+=MAP.city.map(d=>pg(d,'fill="#0E1824" stroke="#3B5270" stroke-width="1.2" vector-effect="non-scaling-stroke"')).join('');
  h+=`<g clip-path="url(#cityclip)">${MAP.forest.map(d=>pg(d,'fill="#0E2A21" opacity=".85"')).join('')}</g>`;
  h+=MAP.parks.map(p=>pg(p.d,'fill="#1F5A3B" opacity=".9"')).join('');
  h+=MAP.water.map(d=>pg(d,'fill="#123E63"')).join('');
  h+=`<g stroke="#1E2C3E" stroke-width=".7" ${S}>${MAP.grid.map(d=>pl(d,'')).join('')}</g>`;
  h+=`<g stroke="#2A3B52" stroke-width="1" ${S}>${MAP.roads.filter(r=>!r.k).map(r=>pl(r.d,'')).join('')}</g>`;
  h+=`<g stroke="#3A4E68" stroke-width="1.6" ${S}>${MAP.roads.filter(r=>r.k).map(r=>pl(r.d,'')).join('')}</g>`;
  h+=`<g stroke="#556A86" stroke-width=".8" stroke-dasharray="2 3" opacity=".75" ${S}>${MAP.wardLines.map(d=>pl(d,'')).join('')}</g>`;
  h+=`<g filter="url(#gl)" ${S}>${MAP.rivers.map(r=>pl(r.d,`stroke="${r.w>1?'#49B6F2':'#2F8CC8'}" stroke-width="${r.w>1?2.6:1.4}"`)).join('')}</g>`;
  h+=`<g stroke="#E8EEF5" stroke-width="1.3" ${S} opacity=".9">${MAP.rail.map(d=>pl(d,'')).join('')}</g>`;
  const SUB={N:'#2FA35E',T:'#F28C28',H:'#35A7E6'};
  for(const k in MAP.subway)h+=`<g stroke="${SUB[k]}" stroke-width="2" ${S}>${MAP.subway[k].map(d=>pl(d,'')).join('')}</g>`;
  h+=`</g>`;
  return h;
}
function setupMaps(){
  $('mainsvg').setAttribute('viewBox',`0 0 ${MAP.W} ${MAP.H}`);

  }

  for(const c of COS){ if(!CO_AT[c])continue;
    const co=DATA.companies[c], ch=T?pct(T.prices[c].price,T.prices[c].prev):0, hh=20+46*Math.min(1,co.price*100/maxCap);
    L.push({t:'co',k:c,at:CO_AT[c],ch,cap:co.price*100,boss:bossOf(c),hl:holders(c),w:Math.max(58,c.length*12+10),h:32+hh+22,ab:32});
  }

    let a=DIST_AT[b.at]||(ST[b.at]?[ST[b.at].x,ST[b.at].y]:null);
    if(!a){const w=(MAP.labels||[]).find(l=>b.at&&(l.n===b.at||b.at.includes(l.n)||l.n.includes(b.at)));if(w)a=[w.x,w.y]}
    if(!a)continue;
    L.push({t:'shop',k:p+'|'+b.name,p,name:b.name,open:b.open,at:[a[0]+.25*KM,a[1]+.45*KM],w:22+(b.name.length+(b.open?0:4))*11.5,h:24,ab:12});
  }
  for(const o of L)if(flagged(o)){o.h+=(o.t==='co'?18:32)+(narrow()?0:22); if(!narrow())o.w=Math.max(o.w,tagW(tagText(o))+8)}   // 旗と札の場所を空ける。札は旗の上に縦に積む＝横に広げない（元の位置から押しのけない）。スマホは札なし
  return L;

// 重なりを押し広げる（元の位置へ弱く引き戻す）＝ずれた物は細い線で元の場所へ
function relax(arr,W,H,fixed=[]){
  const hx=o=>o.px-o.w/2, hy=o=>o.py-(o.h-o.ab);     // 元の位置（アンカー＝箱の下から ab の所）
  for(const o of arr){o.x=hx(o);o.y=hy(o);}
  for(let it=0;it<260;it++){
    for(let i=0;i<arr.length;i++)for(let j=i+1;j<arr.length;j++){const a=arr[i],b=arr[j];
      const ox=Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x)+4, oy=Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y)+4;
      if(ox>0&&oy>0){ if(ox<oy){const s=(a.x+a.w/2<b.x+b.w/2?-1:1)*ox/2;a.x+=s;b.x-=s}else{const s=(a.y+a.h/2<b.y+b.h/2?-1:1)*oy/2;a.y+=s;b.y-=s} } }
    for(const a of arr)for(const f of fixed){   // 見出し・ボタンの下には潜らせない
      const ox=Math.min(a.x+a.w,f.x+f.w)-Math.max(a.x,f.x), oy=Math.min(a.y+a.h,f.y+f.h)-Math.max(a.y,f.y);
      if(ox>0&&oy>0){if(oy<ox)a.y+=(a.y+a.h/2<f.y+f.h/2?-oy:oy);else a.x+=(a.x+a.w/2<f.x+f.w/2?-ox:ox)}}
    const k=it<160?.03:0;   // 最後は引き戻さない＝重なりを残さない
    for(const o of arr){o.x+=(hx(o)-o.x)*k;o.y+=(hy(o)-o.y)*k;o.x=Math.max(4,Math.min(W-o.w-4,o.x));o.y=Math.max(4,Math.min(H-o.h-4,o.y));}
  }
}

    const cx=o.t==='shop'?o.x+7:o.x+o.w/2, cy=o.y+o.h-o.ab;
    if(Math.hypot(cx-o.px,cy-o.py)>8)body+=`<line x1="${o.px}" y1="${o.py}" x2="${cx}" y2="${cy}" stroke="#C8D6EA" stroke-width="1.2" stroke-dasharray="3 2" opacity=".85"/><circle cx="${o.px}" cy="${o.py}" r="3" fill="#C8D6EA" stroke="#050A10"/>`;
  }
  for(const o of vis.filter(o=>o.t==='lot'))body+=drawLot(o,false);
  for(const o of vis.filter(o=>o.t==='shop'))body+=drawShop(o);
  for(const o of vis.filter(o=>o.t==='co').sort((a,b)=>a.py-b.py))body+=drawCo(o,maxCap,false);
  svg.innerHTML=s+body.replace(/url\(#glo\)/g,`url(#glo${svgId})`);
  svg.querySelectorAll('[data-co]').forEach(g=>g.addEventListener('click',()=>select(g.dataset.co)));
  svg.querySelectorAll('[data-core]').forEach(g=>g.addEventListener('click',()=>{VK='core';drawMaps()}));
}
function ownLine(p){   // ログイン後の地図の題の下＝あなたの物の数え上げ1行
  const cs=colorShare(p);
  const hold=T&&T.players[p]?T.players[p].hold:{}, kab=COS.filter(c=>hold[c]>0&&hold[c]<51);
  if(!cs.boss&&!kab.length&&!cs.lots&&!cs.shops)return `<small class="ownline none">まだ何も持っていません＝ビルを 51 株で社長に</small>`;
  const parts=[];   // 空の項目は出さない
  if(cs.boss)parts.push(`社長 <b>${cs.boss}</b>社`);
  if(kab.length)parts.push(`株主 <b>${kab.length}</b>社（${kab.map(c=>`${esc(c)} ${hold[c]}株`).join('・')}）`);
  if(cs.lots)parts.push(`土地 <b>${cs.lots}</b>区画`);
  if(cs.shops)parts.push(`店 <b>${cs.shops}</b>`);
  const near=kab.slice().sort((a,b)=>hold[b]-hold[a])[0];   // 社長に一番近い会社を1社だけ
  return `<small class="ownline">あなたの物：${parts.join('・')}${near?`<span class="near">${esc(near)}は社長まであと <b>${51-hold[near]}</b>株</span>`:''}</small>`;

function spark(hist,w=90,h=26,col){
  if(hist.length<2)return '';
  const mn=Math.min(...hist),mx=Math.max(...hist),r=mx-mn||1;
  const pts=hist.map((v,i)=>`${(i/(hist.length-1)*w).toFixed(1)},${(h-2-(v-mn)/r*(h-4)).toFixed(1)}`).join(' ');
  const up=hist[hist.length-1]>=hist[0];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${col||(up?css('up'):css('down'))}" stroke-width="1.8" stroke-linejoin="round"/></svg>`;
}

const LS='minkei2_login';
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(name,pass){
  const e=SEC[name]; if(!e)throw new Error('none');
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(e.s),iterations:150000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(e.i)},key,b64(e.c));
  return JSON.parse(new TextDecoder().decode(pt));
}
function loginForm(msg){
  const names=Object.keys(SEC); $('mebox').innerHTML='';   // ログイン前＝地図を最初に見せる（入口は地図の下）
  if(!names.length){
    $('loginbox').innerHTML=`<div class="login"><div class="lt"><b>ログイン</b><span>作戦フォームで「合言葉」を登録しておくと、結果が出た後、ここにゲーム名と合言葉を入れて「あなたの札幌」（あなたの色の街・現金・借金・作戦と裁き）が見られます。</span></div></div>`;
    return;
  }
  $('loginbox').innerHTML=`<form class="login" id="lf"><div class="lt"><b>ログイン＝あなたの札幌</b><span>ゲーム名と合言葉で、地図があなたの色だけ光る「あなたの札幌」に切り替わります。</span></div>
  <label for="ln">ゲーム名<select id="ln">${names.map(n=>`<option>${esc(n)}</option>`).join('')}</select></label>
  <label for="lp">合言葉<input id="lp" type="password" autocomplete="current-password" required></label>
  <button type="submit">ログイン</button>${msg?`<p class="err">${esc(msg)}</p>`:''}</form>`;
  $('lf').addEventListener('submit',async ev=>{ev.preventDefault();
    const n=$('ln').value,pw=$('lp').value;
    try{const d=await unlock(n,pw);try{localStorage.setItem(LS,JSON.stringify({n,pw}))}catch(_){} showMe(n,d)}
    catch(_){loginForm('ゲーム名か合言葉が違います。合言葉は作戦フォームで登録したものです（大文字・小文字も区別します）。')}
  });
}
function logout(){try{localStorage.removeItem(LS)}catch(_){} ME=null; $('mysec').hidden=true;$('mysec').innerHTML='';loginForm();drawMaps()}
function showMe(me,D){
  ME=me; const pc=color(me), cs=colorShare(me); $('loginbox').innerHTML='';
  $('mebox').innerHTML=`<div class="me" style="--pc:${pc}"><div><div class="who"><b>${esc(me)}</b> さん・ログイン中（この端末に覚えています） <button type="button" class="out" id="lo">ログアウト</button></div>
  <div class="big">あなたの色：<em>土地${cs.lots}区画</em>・<em>店${cs.shops}軒</em>・<em>社長${cs.boss}社</em></div></div>
  <div class="pc">街の${cs.pct}%<small>土地の区画＋営業中の店＋6社のうち、あなたの色の割合</small></div></div>`;
  $('lo').addEventListener('click',logout);
  const P=D.P, rank=players.map(p=>T.players[p].worth).sort((a,b)=>b-a).indexOf(P.worth)+1;
  const hold=COS.filter(c=>P.hold[c]>0);
  const wh=[400,...D.mine.map(d=>d.worth).filter(v=>v!=null)];
  let h=`<h2>あなただけの数字（${DATA.turn}日目の後）</h2>
  <dl class="tiles"><div class="tile"><dt>値打ち</dt><dd class="num">${man(P.worth)}</dd></div><div class="tile"><dt>現金</dt><dd class="num">${man(P.cash)}</dd></div><div class="tile"><dt>借金</dt><dd class="num">${man(P.loan)}</dd></div><div class="tile"><dt>見せ合いの順位</dt><dd class="num">${rank}位 / ${players.length}人</dd></div></dl>
  <div class="card trend" style="margin-top:12px"><h2 style="margin:0">値打ちの推移（スタート400万→）</h2>${spark(wh,600,70,pc).replace('width="600" height="70"','width="100%" height="70" preserveAspectRatio="none"')}<div class="num" style="font-size:12px;color:var(--txt2)">${wh.map(v=>man(v)).join(' → ')}</div></div>`;
  h+=`<div class="card" style="margin-top:12px"><div class="scroll"><table class="tbl"><thead><tr><th>持ち株</th><th>株数</th><th>株価</th><th>時価</th><th>社長</th></tr></thead><tbody>${hold.length?hold.map(c=>`<tr><td>${esc(c)}</td><td class="num">${P.hold[c]}</td><td class="num">${DATA.companies[c].price.toFixed(2)}万</td><td class="num">${man(P.hold[c]*DATA.companies[c].price)}</td><td>${P.hold[c]>=51?'★':''}</td></tr>`).join(''):'<tr><td colspan="5" style="text-align:left;color:var(--txt3)">まだ株を持っていません</td></tr>'}</tbody></table></div></div>`;
  if((P.biz||[]).length)h+=`<div class="card" style="margin-top:12px"><div class="scroll"><table class="tbl"><thead><tr><th>あなたの店</th><th>場所</th><th>元手</th><th>これまでの稼ぎ</th><th>状態</th></tr></thead><tbody>${P.biz.map(b=>`<tr><td>${esc(b.name)}</td><td>${esc(b.at)}</td><td class="num">${man(b.amt)}</td><td class="num">${man(b.earned||0)}</td><td>${b.open?(DATA.turn<b.from?'来月から':'営業中'):'閉店'}</td></tr>`).join('')}</tbody></table></div></div>`;
  h+=`<h2 style="margin-top:22px">あなたの作戦と裁き</h2><div>`;
  for(const d of D.mine.slice().reverse()){
    h+=`<div class="day"><div class="d">${d.turn}日目</div>`;
    if(d.plan)h+=`<div class="quote"><small>あなたの作戦</small>${esc(d.plan)}</div>`;
    if(d.aim)h+=`<div class="quote"><small>狙い</small>${esc(d.aim)}</div>`;
    h+=`<ul style="margin:0;padding-left:1.1em;font-size:13.5px">${d.acts.map(a=>`<li>${esc(a.text)}${a.why?`<span style="display:block;color:var(--txt2);font-size:12px">なぜ＝${esc(a.why)}</span>`:''}</li>`).join('')}</ul>`;
    if(d.secret&&d.secret.length)h+=`<div class="quote"><small>あなたにだけ見える記録</small>${d.secret.map(esc).join('\n')}</div>`;
    if(d.gm)h+=`<div class="quote"><small>審判から</small>${esc(d.gm)}</div>`;
    if(d.objection)h+=`<div class="quote"><small>異議申し立て → ${esc(d.objection_result||'次の裁きの前に判定')}</small>${esc(d.objection)}</div>`;
    h+=`</div>`;
  }
  h+=`</div>`;
  $('mysec').innerHTML=h; $('mysec').hidden=false;
  // スマホは中心部から始まる＝あなたの物が中心部の外にあれば市街地に切り替えて最初から見せる
  {const F=TOWN(), mo=items().filter(ownMark), inF=o=>{const [x,y]=o.at;return x>F.x&&x<F.x+F.w&&y>F.y&&y<F.y+F.h};
   VK=mo.length&&!mo.some(inF)?'whole':'town';}
  drawMaps();
}
