<title>みん経 札幌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --ground:#0B1118; --panel:#121A24; --panel2:#182232; --line:#26344A;
  --txt:#E6EBF2; --txt2:#95A2B6; --txt3:#6D7A8E;
  --p1:#F0A63A; --p2:#3FB0BF; --p3:#D2555F; --mkt:#56606F;
  --up:#46B98A; --down:#E2626A; --snow:#F4F7FB;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--txt);font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;line-height:1.6;font-size:15px}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:14px 56px}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.up{color:var(--up)} .dn{color:var(--down)}
a{color:var(--snow)}
a:focus-visible,button:focus-visible{outline:2px solid var(--p1);outline-offset:2px}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding-block:6px 14px;border-bottom:1px solid var(--line)}
.logo{font-family:"Dela Gothic One",sans-serif;font-size:clamp(20px,3.4vw,28px);line-height:1.1;letter-spacing:.01em}
.logo small{display:block;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.16em;color:var(--txt3);margin-top:4px}
.stats{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:baseline;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:12.5px;color:var(--txt2)}
.chip b{color:var(--txt);font-size:14px;font-weight:600}
.chip.hot{border-color:var(--p1)} .chip.hot b{color:var(--p1)}

/* private banner */
.me{margin-top:14px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--pc,var(--p1));border-radius:12px;padding:12px 14px}
.me .dot{width:14px;height:14px;border-radius:4px;background:var(--pc,var(--p1));grid-row:span 2}
.me b{font-size:17px} .me span{font-size:12.5px;color:var(--txt2)}

/* layout */
.main{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;margin-top:16px;align-items:start}
@media (max-width:820px){.main{grid-template-columns:1fr}}
h2{font-size:14px;letter-spacing:.08em;color:var(--txt2);font-weight:700;margin:0 0 10px}
.sec{margin-top:26px}

/* city */
.stage{position:relative;border-radius:16px;overflow:hidden;background:#0E1620;border:1px solid var(--line)}
.stage canvas{display:block;width:100%;height:auto;touch-action:manipulation;cursor:pointer}
.news{background:var(--panel);border:1px solid rgba(240,166,58,.55);border-radius:12px;padding:9px 13px;font-size:13px;margin-bottom:10px}
.news .h{font-weight:700;font-size:14px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.news em{font-style:normal;font-size:10.5px;font-weight:700;color:#1C1204;background:var(--p1);border-radius:4px;padding:0 6px}
.news em.boj{background:var(--snow)}
.news p{margin:2px 0 0;color:var(--txt2);font-size:12.5px}
.legend{position:absolute;left:10px;bottom:10px;display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;background:rgba(11,17,24,.8);border-radius:10px;padding:4px 10px;color:var(--txt2)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}
.hint{font-size:12px;color:var(--txt3);margin:6px 2px 0}

/* side: showcase */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.rank{display:flex;flex-direction:column;gap:12px}
.row .nm{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px}
.row .nm b{display:flex;align-items:center;gap:7px}
.row .nm i{width:10px;height:10px;border-radius:3px;display:inline-block}
.bar{height:10px;border-radius:99px;background:var(--panel2);overflow:hidden;margin-top:5px}
.bar b{display:block;height:100%;border-radius:99px}
.row small{display:block;font-size:11.5px;color:var(--txt3);margin-top:3px}
.empty{color:var(--txt3);font-size:13px}

/* company detail */
.co{margin-top:14px}
.co .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.co .t b{font-size:18px}
.co .t .num{font-size:18px}
.co .k{font-size:12px;color:var(--txt2)}
.hold{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--panel2);margin-top:8px}
.hold b{display:block;height:100%}
.hl{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:12px;color:var(--txt2);margin-top:5px}
.hl i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle}

/* companies grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.cc{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;text-align:left;color:inherit;font:inherit}
.cc[aria-pressed="true"]{border-color:var(--snow)}
.cc .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.cc .t b{font-size:15.5px}
.cc .p{display:flex;justify-content:space-between;align-items:end;gap:8px;margin-top:4px}
.cc .p .num{font-size:20px;font-weight:600}
.cc .f{font-size:12px;color:var(--txt3);margin-top:6px}
.boss{font-size:11px;font-weight:700;border-radius:4px;padding:0 6px;color:#0B1118}

/* moves */
.moves{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.mv h3{margin:0 0 6px;font-size:15px;display:flex;align-items:center;gap:8px}
.mv h3 i{width:10px;height:10px;border-radius:3px;display:inline-block}
.mv ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.mv li{font-size:13.5px}
.mv li span{display:block;font-size:12px;color:var(--txt2)}
.alert{background:#2A1418;border:1px solid var(--down);border-radius:12px;padding:10px 14px;font-size:13.5px}

/* login */
.login{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:end}
.login .lt{flex:1 1 240px}
.login .lt b{font-size:16px;display:block} .login .lt span{font-size:12.5px;color:var(--txt2)}
.login label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--txt2)}
.login select,.login input{font:inherit;font-size:15px;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:0;width:170px;max-width:100%}
.login button,.out{font:inherit;font-weight:700;font-size:14.5px;background:var(--p1);color:#1C1204;border:0;border-radius:10px;padding:10px 16px;cursor:pointer}
.out{background:transparent;color:var(--txt2);border:1px solid var(--line);font-weight:500;font-size:13px;padding:6px 12px}
.err{flex-basis:100%;font-size:12.5px;color:var(--down);margin:0}
/* my page */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tile dt{font-size:12px;color:var(--txt2)} .tile dd{margin:2px 0 0;font-size:22px;font-weight:600}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th,.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{font-size:12px;color:var(--txt2);font-weight:500}
.scroll{overflow-x:auto}
.day{border-left:2px solid var(--line);padding:2px 0 2px 14px;display:flex;flex-direction:column;gap:6px}
.day+.day{margin-top:16px}
.day .d{font-size:12px;color:var(--txt3);letter-spacing:.06em}
.quote{background:var(--panel2);border-radius:10px;padding:8px 12px;font-size:13.5px;white-space:pre-wrap}
.quote small{display:block;color:var(--txt3);font-size:11.5px;margin-bottom:2px}

/* rules */
.rules{display:flex;flex-direction:column;gap:2px}
details{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
details+details{margin-top:6px}
summary{cursor:pointer;font-size:13.5px;font-weight:700}
summary .num{color:var(--txt3);font-weight:500;margin-right:8px;font-size:12px}
details p{margin:6px 0 2px;font-size:13px;color:var(--txt2);max-width:70ch}

/* cta */
.cta{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--p1);border-radius:14px;padding:14px 16px}
.cta b{font-size:16px} .cta span{font-size:13px;color:var(--txt2);display:block}
.btn{display:inline-block;background:var(--p1);color:#1C1204;font-weight:700;border-radius:11px;padding:11px 18px;text-decoration:none;font-size:14.5px}
footer{margin-top:28px;font-size:12px;color:var(--txt3);max-width:72ch}
</style>

    </div>
  </section>

  <footer id="foot"></footer>
</div>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(name,pass){
  const e=SEC[name]; if(!e)throw new Error('none');
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(e.s),iterations:150000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);

  return JSON.parse(new TextDecoder().decode(pt));
}

  });
}

/* ---- companies grid ---- */
function spark(hist){
  const w=90,h=26,mn=Math.min(...hist),mx=Math.max(...hist),r=mx-mn||1;
  if(hist.length<2)return '';
  const pts=hist.map((v,i)=>`${(i/(hist.length-1)*w).toFixed(1)},${(h-2-(v-mn)/r*(h-4)).toFixed(1)}`).join(' ');
  const up=hist[hist.length-1]>=hist[0];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${up?css('up'):css('down')}" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
}

    <div class="t"><b>${esc(c)}</b>${boss?`<span class="boss" style="background:${color(boss.p)}">社長 ${esc(boss.p)}</span>`:''}</div>
    <div class="p"><span class="num">${co.price.toFixed(2)}<small style="font-size:12px;color:var(--txt2)">万/株</small></span><span>${spark(DATA.history[c])}</span></div>

  h+=`<h2 style="margin-top:22px">あなたの作戦と裁き</h2><div>`;

    if(d.secret&&d.secret.length)h+=`<div class="quote"><small>あなたにだけ見える記録</small>${d.secret.map(esc).join('\n')}</div>`;
    if(d.gm)h+=`<div class="quote"><small>審判から</small>${esc(d.gm)}</div>`;
    if(d.objection)h+=`<div class="quote"><small>異議申し立て → ${esc(d.objection_result||'次の裁きの前に判定')}</small>${esc(d.objection)}</div>`;

/* ---- city (isometric) ---- */
const LM={"札北銀行":[4,3],"北海鉄道":[1,2],"ニトロ家具":[6,6],"セイカマート":[1,6],"北海ビール":[6,1],"白い恋文製菓":[5,5]};
const N=9, ROAD=3, PARK=4;
function rnd(i,j){const h=Math.sin(i*127.1+j*311.7)*43758.5453;return h-Math.floor(h)}
let hit=[];
function draw(){
  const cv=$('city'), st=$('stage'), W=st.clientWidth, H=Math.round(W*(W<520?0.95:0.72)), dpr=window.devicePixelRatio||1;
  cv.width=W*dpr; cv.height=H*dpr; cv.style.height=H+'px';
  const g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
  const TW=W/(N+0.4), TH=TW/2, ox=W/2, oy=H-(N*TH)-TH*0.9;
  g.fillStyle='#0E1620'; g.fillRect(0,0,W,H);
  const P=(i,j)=>[ox+(i-j)*TW/2, oy+(i+j)*TH/2];
  const dia=(x,y,w,h)=>{g.beginPath();g.moveTo(x,y-h/2);g.lineTo(x+w/2,y);g.lineTo(x,y+h/2);g.lineTo(x-w/2,y);g.closePath()};
  const lmAt={}; for(const c in LM)lmAt[LM[c].join(',')]=c;
  const heatOf=c=>{if(!T)return 0;const v=pct(T.prices[c].price,T.prices[c].prev)/12;return Math.max(-1,Math.min(1,v))};
  const hc=v=>v>=0?`rgba(70,185,138,${.10+v*.6})`:`rgba(226,98,106,${.10-v*.6})`;
  const labels=[]; hit=[];
  for(let s=0;s<2*N-1;s++)for(let i=0;i<N;i++){const j=s-i;if(j<0||j>=N)continue;
    const [x,y]=P(i,j), c=lmAt[i+','+j];
    dia(x,y,TW,TH);
    const road=i===ROAD, park=j===PARK&&!road, tower=park&&i===N-1;
    g.fillStyle=road?'#1A212B':park?'#2F5A3C':'#1C2530'; g.fill();
    if(c){dia(x,y,TW*1.02,TH*1.02);g.fillStyle=hc(heatOf(c));g.fill();}
    g.strokeStyle='rgba(0,0,0,.35)';g.lineWidth=.6;dia(x,y,TW,TH);g.stroke();
    if(road){g.strokeStyle='rgba(230,200,120,.35)';g.setLineDash([3,3]);g.beginPath();g.moveTo(x-TW/4,y-TH/4);g.lineTo(x+TW/4,y+TH/4);g.stroke();g.setLineDash([]);continue}
    if(park&&!tower){g.fillStyle='#3F7A4E';for(const [a,b] of [[-.18,0],[.13,-.05],[0,.1]]){g.beginPath();g.arc(x+a*TW,y+b*TW-2,TW*.08,0,7);g.fill();}continue}
    if(tower){const k=TW/38;g.strokeStyle='#C9793A';g.lineWidth=1.4;g.beginPath();g.moveTo(x-6*k,y+2);g.lineTo(x,y-78*k);g.lineTo(x+6*k,y+2);g.stroke();
      for(let q=1;q<6;q++){const yy=y+2-q*13*k,w=6*k*(1-q/6.5);g.beginPath();g.moveTo(x-w,yy);g.lineTo(x+w,yy);g.stroke();}continue}
    let h, roof, stroke=null, w=TW*.78, hh=TH*.78;
    if(c){
      const co=DATA.companies[c], cap=co.price*100; h=TW*(0.75+Math.min(cap,900)/900*0.85);
      const hl=holders(c), boss=hl.list.find(x=>x.n>=51), top=hl.list.slice().sort((a,b)=>b.n-a.n)[0];
      roof=boss?color(boss.p):'#6A7484'; if(!boss&&top&&top.n>=20)stroke=color(top.p);
      w=TW*.86; hh=TH*.86;
    }else{
      const r=rnd(i,j),dc=Math.hypot(i-3.5,j-4); h=TW*(.25+(1-Math.min(dc/5.5,1))*1.05*(.5+r*.6)); roof='#3B4555';
    }
    g.beginPath();g.moveTo(x-w/2,y);g.lineTo(x,y+hh/2);g.lineTo(x,y+hh/2-h);g.lineTo(x-w/2,y-h);g.closePath();g.fillStyle=c?'#46505F':'#2E3744';g.fill();
    g.beginPath();g.moveTo(x,y+hh/2);g.lineTo(x+w/2,y);g.lineTo(x+w/2,y-h);g.lineTo(x,y+hh/2-h);g.closePath();g.fillStyle=c?'#343D4A':'#232B36';g.fill();
    g.strokeStyle=c?'rgba(200,220,240,.18)':'rgba(180,205,230,.08)';g.lineWidth=.8;
    for(let f=6;f<h-2;f+=Math.max(4,TW/8)){g.beginPath();g.moveTo(x-w/2+1,y-f);g.lineTo(x,y+hh/2-f);g.lineTo(x+w/2-1,y-f);g.stroke();}
    dia(x,y-h,w,hh);g.fillStyle=roof;g.fill();
    if(stroke){g.strokeStyle=stroke;g.lineWidth=2;dia(x,y-h,w,hh);g.stroke();}
    if(c){
      if(selected===c){g.strokeStyle='#fff';g.lineWidth=2;dia(x,y-h,w,hh);g.stroke();}
      labels.push([x,y-h-hh/2-4,c]); hit.push({c,x,y:y-h/2,r:Math.max(w,h)/1.6});
    }
  }
  const fs=Math.max(10,Math.min(13,W/48)); const placed=[];
  labels.sort((a,b)=>a[1]-b[1]);
  for(const [x,y,c] of labels){
    const co=DATA.companies[c], ch=T?pct(T.prices[c].price,T.prices[c].prev):null;
    const a=c, b=co.price.toFixed(2)+'万'+(ch===null?'':' '+sgn(ch));
    g.font=`700 ${fs}px "Zen Kaku Gothic New",sans-serif`; const w1=g.measureText(a).width;
    g.font=`600 ${fs-1}px "IBM Plex Mono",monospace`; const w2=g.measureText(b).width;
    const bw=Math.max(w1,w2)+12, bh=fs*2+10, bx=Math.max(4,Math.min(x-bw/2,W-bw-4)); let by=Math.max(4,y-bh);
    const ov=yy=>placed.some(q=>bx<q[0]+q[2]+3&&bx+bw+3>q[0]&&yy<q[1]+q[3]+3&&yy+bh+3>q[1]);
    let tries=0; while(ov(by)&&tries++<12){by+= (by-bh-4>=4 && tries<6)? -(bh+4) : (bh+4);} placed.push([bx,by,bw,bh]);
    g.fillStyle='rgba(11,17,24,.86)';g.beginPath();g.roundRect?g.roundRect(bx,by,bw,bh,6):g.rect(bx,by,bw,bh);g.fill();
    if(selected===c){g.strokeStyle='#fff';g.lineWidth=1.2;g.stroke();}
    g.textAlign='center';g.fillStyle='#E6EBF2';g.font=`700 ${fs}px "Zen Kaku Gothic New",sans-serif`;g.fillText(a,bx+bw/2,by+fs+2);
    g.font=`600 ${fs-1}px "IBM Plex Mono",monospace`;g.fillStyle=ch===null?'#95A2B6':ch>=0?css('up'):css('down');g.fillText(b,bx+bw/2,by+fs*2+5);
  }
}
$('city').addEventListener('click',e=>{
  const r=$('city').getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
  let best=null,bd=1e9; for(const h of hit){const d=Math.hypot(h.x-x,h.y-y); if(d<h.r*1.4&&d<bd){bd=d;best=h.c}}
  if(best)select(best);
});
select(COS.includes('札北銀行')?'札北銀行':COS[0]);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(draw);
addEventListener('resize',draw);
